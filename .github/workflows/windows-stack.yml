name: Unsigned UMD candidate compile proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: unsigned-umd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.regression.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Verify exact publication inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          r=pathlib.Path('.')
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='7e0e6b73c140b919dde20679e65e3a23dae40764'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          expected={'ci/windows/Build-SE2UmdCandidate.ps1': 'bcc8ec22f31a6e4df69ad0c1d644f7176de889f01af866fcf07bb7bb08e55fbc', 'ci/windows/tests/queue-unwind-regression.py': 'd111cef1f5a33bf8a1fb1adf12eeb75cb1c8459c9beb9b9508eaff6b5c7140c2', 'ci/windows/patches/dxvk-queue-unwind.patch': 'c8445d367110dd28fa4abdf24fa0db00e62e6688b1557a96deccae8d08e939ab'}
          allowed=sorted(['.github/workflows/windows-stack.yml',*expected])
          actual=sorted(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==allowed,(actual,allowed)
          for n,h in expected.items():assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          PY
      - name: Initialize frozen DXVK source
        shell: bash
        run: git submodule update --init --recursive dxvk-helios
      - name: Qualify source and run host regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dxvk-helios rev-parse HEAD)" = 316a457fb247ca1f9d99aa5a47963eadb06f693c
          git -C dxvk-helios show 316a457fb247ca1f9d99aa5a47963eadb06f693c:src/dxvk/dxvk_queue.cpp > "$RUNNER_TEMP/queue-original.cpp"
          git -C dxvk-helios apply --check "$GITHUB_WORKSPACE/ci/windows/patches/dxvk-queue-unwind.patch"
          git -C dxvk-helios apply "$GITHUB_WORKSPACE/ci/windows/patches/dxvk-queue-unwind.patch"
          python3 ci/windows/tests/queue-unwind-regression.py --candidate dxvk-helios/src/dxvk/dxvk_queue.cpp --original "$RUNNER_TEMP/queue-original.cpp" --output "$RUNNER_TEMP/queue-regression"
          test "$(stat -c %s "$RUNNER_TEMP/queue-regression/proof.json")" -le 1048576
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: queue-regression-proof
          path: ${{ runner.temp }}/queue-regression/proof.json
          if-no-files-found: error
          retention-days: 1

  compile_umd:
    needs: regression
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact publication inputs
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          r=pathlib.Path('.')
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='7e0e6b73c140b919dde20679e65e3a23dae40764'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          expected={'ci/windows/Build-SE2UmdCandidate.ps1': 'bcc8ec22f31a6e4df69ad0c1d644f7176de889f01af866fcf07bb7bb08e55fbc', 'ci/windows/tests/queue-unwind-regression.py': 'd111cef1f5a33bf8a1fb1adf12eeb75cb1c8459c9beb9b9508eaff6b5c7140c2', 'ci/windows/patches/dxvk-queue-unwind.patch': 'c8445d367110dd28fa4abdf24fa0db00e62e6688b1557a96deccae8d08e939ab'}
          allowed=sorted(['.github/workflows/windows-stack.yml',*expected])
          actual=sorted(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==allowed,(actual,allowed)
          for n,h in expected.items():assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          assert os.environ['REGRESSION_SHA']=='574b4b898ba6c492da326879e74fd3e9fd13196d7320cd85a54e2c6c598dcd52'
        env:
          REGRESSION_SHA: ${{ needs.regression.outputs.candidate_sha }}
      - name: Initialize frozen DXVK source
        shell: pwsh
        run: |
          git submodule update --init --recursive dxvk-helios
          if ($LASTEXITCODE -ne 0) { throw 'DXVK checkout failed.' }
      - name: Prepare Python build tools
        shell: pwsh
        run: |
          python -m pip install 'meson==1.11.2' ninja
          if ($LASTEXITCODE -ne 0) { throw 'Build tool setup failed.' }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-14
      - name: Prepare pinned standalone shader compiler
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'glslang-16.6.0'
          assert not root.exists(), 'Shader tool root must be fresh'
          url = 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(13734780)
          assert len(data) == 13734779
          assert hashlib.sha256(data).hexdigest() == '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          archive = root.with_suffix('.zip')
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as source:
              for name in source.namelist():
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts and ':' not in name and chr(92) not in name
              source.extractall(root)
          compiler = root / 'bin' / 'glslang.exe'
          assert hashlib.sha256(compiler.read_bytes()).hexdigest() == '9643709c02c83e26773f96b6a87f197ab2e84f78be0879ad8fb3619418b5d9ad'
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(compiler.parent) + '\n')
      - name: Compile unsigned UMD and inspect PE proof
        shell: pwsh
        run: ./ci/windows/Build-SE2UmdCandidate.ps1 -RepoRoot $env:GITHUB_WORKSPACE -BuildRoot "$env:RUNNER_TEMP/umd-candidate-build" -OutputDir "$env:RUNNER_TEMP/umd-candidate-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-umd-compile-proof
          path: |
            ${{ runner.temp }}/umd-candidate-proof/helios_umd.dll
            ${{ runner.temp }}/umd-candidate-proof/proof.json
            ${{ runner.temp }}/umd-candidate-proof/imports.txt
            ${{ runner.temp }}/umd-candidate-proof/exports.txt
          if-no-files-found: error
          retention-days: 1

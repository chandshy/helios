name: SE2 SDK diagnostic only
on:
  workflow_dispatch:
    inputs:
      spend_authorization:
        description: 'Type USD0.01 for this single evidence-only job; no signing or trust changes.'
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_TERMINAL_PROMPT: '0'
  SE2_SPEND_AUTHORIZATION: ${{ inputs.spend_authorization }}
  SE2_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
concurrency:
  group: se2-b-package-only
  cancel-in-progress: false
jobs:
  tool-diagnostic:
    if: ${{ github.event.repository.visibility == 'public' && github.repository == 'chandshy/helios' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Observe exact preinstalled SDK and WDK metadata only
        shell: pwsh
        run: ./ci/windows/Package-SE2BDriver.ps1 -Mode ToolDiagnostic -RepoRoot $env:GITHUB_WORKSPACE
      - name: Retain strict public tool admission diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: se2-b-tool-admission-public
          path: ${{ runner.temp }}/se2-b-tool-admission.json
          if-no-files-found: error
          retention-days: 1

name: SE2 SDK diagnostic only
on:
  workflow_dispatch:
    inputs:
      spend_authorization:
        description: 'Type USD0.01 for this single evidence-only job; no signing or trust changes.'
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_TERMINAL_PROMPT: '0'
  SE2_SPEND_AUTHORIZATION: ${{ inputs.spend_authorization }}
  SE2_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
concurrency:
  group: se2-b-package-only
  cancel-in-progress: false
jobs:
  tool-diagnostic:
    if: ${{ github.event.repository.visibility == 'public' && github.repository == 'chandshy/helios' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Observe exact preinstalled SDK and WDK metadata only
        shell: pwsh
        run: ./ci/windows/Package-SE2BDriver.ps1 -Mode ToolDiagnostic -RepoRoot $env:GITHUB_WORKSPACE
      - name: Read original Inf2Cat Authenticode policy error
        if: ${{ always() }}
        shell: pwsh
        run: |
          . ./ci/windows/Package-SE2BDriver.ps1 -Mode Functions -RepoRoot $env:GITHUB_WORKSPACE
          Assert-Source
          $null=Assert-Admission
          $artifactDir=Join-Path $env:RUNNER_TEMP 'se2-b-public-diagnostic'
          Require (Test-Path -LiteralPath $artifactDir -PathType Container) 'STOP_DIAGNOSTIC_DIRECTORY'
          Save-Json @{sourceCommit=$env:GITHUB_SHA;runID=$env:GITHUB_RUN_ID;status='not-run';reason='verifier-prerequisite-not-admitted';targetExecuted=$false;keysOrTrustChanged=$false} (Join-Path $artifactDir 'se2-b-inf2cat-verification.json')
          $signTool=Assert-Tool 'SignTool' $ToolSpecs.SignTool
          Recheck-Tool $signTool
          $target=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/10.0.26100.0/x86/Inf2Cat.exe'
          Require ((Hash $target) -ceq '31fd4bef7237be82e3684503b248eeeb906ebce8a94ccf9f1a8254f00db1ebca') 'STOP_ORIGINAL_INF2CAT_CHANGED'
          $previousNativePreference=$PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference=$false
            $output=(& $signTool.path verify /pa /all /v /debug $target 2>&1 | Out-String)
            $exit=$LASTEXITCODE
          } finally { $PSNativeCommandUseErrorActionPreference=$previousNativePreference }
          Require ($output.Length -le 262144) 'STOP_VERIFIER_OUTPUT_SIZE'
          Require ((Hash $target) -ceq '31fd4bef7237be82e3684503b248eeeb906ebce8a94ccf9f1a8254f00db1ebca') 'STOP_ORIGINAL_INF2CAT_CHANGED'
          Save-Json @{sourceCommit=$env:GITHUB_SHA;runID=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;toolSha256=$signTool.sha256;targetSha256=(Hash $target);policy='verify /pa /all /v /debug';exitCode=$exit;output=$output;targetExecuted=$false;keysOrTrustChanged=$false} (Join-Path $artifactDir 'se2-b-inf2cat-verification.json')
      - name: Admit exact bounded public diagnostics
        id: diagnostic_upload_admission
        if: ${{ always() }}
        shell: pwsh
        run: |
          . ./ci/windows/Package-SE2BDriver.ps1 -Mode Functions
          try {
            Assert-DiagnosticArtifact "$env:RUNNER_TEMP/se2-b-public-diagnostic"
            'admitted=true' >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host 'SE2_DIAGNOSTIC_UPLOAD_WITHHELD: exact regular files or aggregate byte bound rejected.'
            throw
          }
      - name: Retain strict public tool admission diagnostics
        if: ${{ always() && steps.diagnostic_upload_admission.conclusion == 'success' && steps.diagnostic_upload_admission.outputs.admitted == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: se2-b-tool-admission-public
          path: |
            ${{ runner.temp }}/se2-b-public-diagnostic/se2-b-tool-admission.json
            ${{ runner.temp }}/se2-b-public-diagnostic/se2-b-inf2cat-verification.json
          if-no-files-found: error
          retention-days: 1
